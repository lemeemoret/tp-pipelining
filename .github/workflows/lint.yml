name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: first-app_01-hello-world
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: first-app_01-hello-world/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npx ng lint
