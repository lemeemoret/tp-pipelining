name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: first-app_01-hello-world
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: first-app_01-hello-world/package-lock.json

      - name: Installation des dependances
        run: npm ci

      - name: Build
        run: npx ng build --base-href /tp-pipelining/

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Envoi du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: first-app_01-hello-world/dist/first-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4